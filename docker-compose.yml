services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OCR_ENGINE: ${OCR_ENGINE}
      FAISS_INDEX_PATH: /app/backend/data/faiss.index
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      - db
    ports: ["8000:8000"]
    volumes:
      - .:/app

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    command: sh -c "npm i && npm run dev -- --host"
    volumes:
      - .:/app
    ports: ["5173:5173"]
    depends_on:
      - backend

  airflow:
    image: apache/airflow:2.9.3
    command: ["bash", "-lc", "airflow standalone"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW_UID: "50000"
      PYTHONPATH: /opt/app
      PROJECT_DATABASE_URL: ${PROJECT_DATABASE_URL}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/app
    ports: ["8080:8080"]
    depends_on:
      - backend
      - db

volumes:
  dbdata:
